name: Create S3 bucket

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy Terraform-managed resources"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-bucket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_MANAGED_BUCKET: naveen-oidc-demo-bucket
      TF_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: login to AWS account is successful
        run: |
         aws sts get-caller-identity
         echo "AWS account login successful"
      - name: check current directory
        run: pwd        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Running terraform initilization
        run: |
          terraform init
      - name: Running terraform fmt and validate
        run: |
          terraform fmt -check
          terraform validate 
      - name: Reconcile existing bucket with Terraform state
        run: |
          if terraform state show aws_s3_bucket.this >/dev/null 2>&1; then
            echo "S3 bucket is already tracked in Terraform state."
          elif [ "$TF_DESTROY" = "true" ]; then
            terraform import aws_s3_bucket.this "$TF_MANAGED_BUCKET"
          elif aws s3api head-bucket --bucket "$TF_MANAGED_BUCKET" 2>/dev/null; then
            terraform import aws_s3_bucket.this "$TF_MANAGED_BUCKET"
          else
            echo "S3 bucket does not exist yet; Terraform will create it."
          fi
      - name: Running terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.destroy != true
        run: |
          terraform plan -out=tfplan
      - name: Running terraform apply
        if: github.event_name != 'workflow_dispatch' || inputs.destroy != true
        run: |
          terraform apply -auto-approve tfplan
      - name: Running terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.destroy == true
        run: |
          terraform destroy -auto-approve