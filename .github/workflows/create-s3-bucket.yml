name: Create S3 bucket

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-bucket:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: login to AWS account is successful
        run: |
         aws sts get-caller-identity
         echo "AWS account login successful"
      - name: check current directory
        run: pwd        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Running terraform initilization
        run: |
          terraform init
      - name: Running terraform fmt and validate
        run: |
          terraform fmt -check
          terraform validate 
      - name: Running terraform plan
        run: |
          terraform plan -out=tfplan
      - name: Running terraform apply
        run: |
          terraform apply -auto-approve tfplan
